# Continuous integration: every push and PR must build, lint and pass unit tests.
# Before the first release, pin each `uses:` to a commit SHA (ADR-0007).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The action's default package list includes the legacy "tools" package, which the
      # SDK repository no longer serves, so sdkmanager exits 1. Install only platform-tools;
      # AGP downloads the exact platform and build-tools it needs (licences are accepted here).
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      # validate-wrappers checks gradle-wrapper.jar against Gradle's published checksums,
      # so a tampered wrapper in a PR fails here before it runs.
      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: true

      # licensee fails the build on any dependency license outside the allow-list
      # in app/build.gradle.kts (ADR-0002, ADR-0011).
      - name: Build, lint, unit tests, license check
        run: ./gradlew --no-daemon --stacktrace lint testDebugUnitTest licensee assembleDebug

      - name: Upload debug APK (for reviewers; not a release artifact)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backrow-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
