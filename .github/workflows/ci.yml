# Continuous integration: every push and PR must build, lint and pass unit tests.
# Session 1 adds the Licensee license-check task to the gradle step.
# Before the first release, pin each `uses:` to a commit SHA (ADR-0007).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, lint, unit tests
        run: ./gradlew --no-daemon --stacktrace lint testDebugUnitTest assembleDebug

      - name: Upload debug APK (for reviewers; not a release artifact)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backrow-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
